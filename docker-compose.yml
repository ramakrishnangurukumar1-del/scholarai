# Full stack — one command: docker compose up --build
#
#   gateway (nginx)  :8080   → single entry point
#     ├── /            → frontend (static)
#     └── /api, /docs  → backend API
#   backend  (FastAPI + Tesseract OCR)
#   worker   (Kafka consumer → TimescaleDB hypertable)
#   db       (PostgreSQL 16 + TimescaleDB)
#   kafka    (KRaft, no ZooKeeper)

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: scholarai
      POSTGRES_PASSWORD: scholarai
      POSTGRES_DB: scholarai
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarai"]
      interval: 5s
      timeout: 5s
      retries: 15

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  backend:
    build: ./backend
    command: ["api"]
    environment:
      DATABASE_URL: postgresql+psycopg://scholarai:scholarai@db:5432/scholarai
      APP_ENV: prod
      JWT_SECRET: ${JWT_SECRET:-change-me-in-real-deployment-please}
      CORS_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      KAFKA_BOOTSTRAP: kafka:9092
      OCR_LANGUAGES: eng+tam+hin
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-flash-lite-latest}
    volumes: ["storage:/app/storage"]
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_healthy }

  worker:
    build: ./backend
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://scholarai:scholarai@db:5432/scholarai
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      backend: { condition: service_started }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    depends_on: [backend]

  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./deploy/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]

volumes:
  pgdata:
  storage:
