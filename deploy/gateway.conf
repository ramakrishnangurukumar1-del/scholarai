# API gateway / edge — single public entry point in front of the app.
# Routes API traffic to the backend, everything else to the frontend.

upstream backend  { server backend:8000; }
upstream frontend { server frontend:80; }

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # API, docs, health → FastAPI
    location ~ ^/(api|docs|redoc|openapi\.json|health) {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # everything else → the React app
    location / {
        proxy_pass       http://frontend;
        proxy_set_header Host $host;
    }
}
