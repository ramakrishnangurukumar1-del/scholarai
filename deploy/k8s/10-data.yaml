# PostgreSQL + TimescaleDB
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: scholarai
spec:
  serviceName: db
  replicas: 1
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      containers:
        - name: db
          image: timescale/timescaledb:latest-pg16
          env:
            - { name: POSTGRES_USER, value: scholarai }
            - { name: POSTGRES_DB, value: scholarai }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: scholarai-secrets, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "scholarai"] }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: db, namespace: scholarai }
spec:
  selector: { app: db }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# Kafka (KRaft)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: scholarai
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          env:
            - { name: KAFKA_CFG_NODE_ID, value: "1" }
            - { name: KAFKA_CFG_PROCESS_ROLES, value: "controller,broker" }
            - { name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093" }
            - { name: KAFKA_CFG_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: ALLOW_PLAINTEXT_LISTENER, value: "yes" }
          ports: [{ containerPort: 9092 }]
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: scholarai }
spec:
  selector: { app: kafka }
  ports: [{ port: 9092, targetPort: 9092 }]
