# Render Blueprint — deploys the ScholarAI API.
# (Frontend goes to Vercel/Netlify; MySQL to Railway/Aiven — see DEPLOY.md.)
services:
  - type: web
    name: scholarai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false          # paste your managed-MySQL URL in the dashboard
      - key: CORS_ORIGINS
        sync: false          # your deployed frontend URL, e.g. https://scholarai.vercel.app
      - key: GOOGLE_API_KEY
        sync: false          # optional — enables the real LLM assistant
